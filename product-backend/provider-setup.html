<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local OpenRouter setup</title><style>[hidden]{display:none!important}body{font:16px system-ui;background:#10121b;color:#eee;max-width:640px;margin:5vh auto;padding:24px}form{display:grid;gap:16px;border:1px solid #424759;padding:24px;border-radius:18px}input,select,button{font:inherit;padding:12px;background:#1b2030;color:#eee;border:1px solid #596173;border-radius:8px;width:100%;box-sizing:border-box}button{background:#adbef7;color:#10121b;cursor:pointer}label{display:grid;gap:8px}small{color:#bec4d0}#status{white-space:pre-wrap}a{color:#adbef7}</style><h1>Connect OpenRouter locally</h1><p>Nemotron Ultra free Â· your key Â· your company</p><form id="login"><label>Local owner email<input id="email" type="email" autocomplete="username" required></label><label>Local password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><form id="setup" hidden><label>Company<input id="company" readonly></label><label>OpenRouter API key<input id="key" type="password" autocomplete="off" placeholder="sk-or-v1-â€¦" required></label><small>The key is encrypted in this instance's company vault. It is never returned by the API or copied into chat. Saving does not make an inference request.</small><label><span>Model</span><input value="nvidia/nemotron-3-ultra-550b-a55b:free" readonly></label><label><span>Assign this model to these company bots</span><select id="bots" multiple size="5"></select></label><button>Save company connection and bot selections</button></form><p id="status" role="status"></p><script>
let token='',companyId='';const $=id=>document.getElementById(id);const model='nvidia/nemotron-3-ultra-550b-a55b:free';async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Request failed (HTTP '+r.status+'). Check owner access and key format.');return r.json();}async function loadBots(){const d=await api('/api/v1/bot-directory/bots?scope=company&companyId='+encodeURIComponent(companyId));$('bots').replaceChildren(...d.bots.map(b=>{const o=new Option(b.name,b.id);o.selected=true;return o;}));}
$('login').onsubmit=async e=>{e.preventDefault();try{const result=await api('/api/v1/auths/signin','POST',{email:$('email').value,password:$('password').value});token=result.token;$('password').value='';const d=await api('/api/v1/companies');const list=Array.isArray(d)?d:d.companies||[];if(list.length!==1)throw Error('This installation requires exactly one configured company.');const row=list[0];const c=Array.isArray(row)?{id:row[0],name:row[1]}:row;const id=c.id||c.company_id;if(typeof id!=='string'||!id.trim()||typeof c.name!=='string'||!c.name.trim())throw Error('The configured company is invalid.');companyId=id;$('company').value=c.name;await loadBots();$('login').hidden=true;$('setup').hidden=false;$('status').textContent=$('bots').options.length?'Select the bots to configure.':'Add bots in the app, then reload.';}catch(e){$('status').textContent=e.message;}};
$('setup').onsubmit=async e=>{e.preventDefault();try{if(!companyId)throw Error('Sign in to the configured company first.');const c=encodeURIComponent(companyId);const ids=Array.from($('bots').selectedOptions).map(o=>o.value);if(!ids.length)throw Error('Select at least one bot.');const saved=await api('/api/v1/companies/'+c+'/provider-connections','POST',{provider:'openrouter',credential:{apiKey:$('key').value}});$('key').value='';for(const bot of ids){const current=await api('/api/v1/companies/'+c+'/bots/'+encodeURIComponent(bot)+'/provider-selection');await api('/api/v1/companies/'+c+'/bots/'+encodeURIComponent(bot)+'/provider-selection','PUT',{connectionId:saved.connectionId,model,expectedRevision:current.configurationRevision});}$('status').textContent='Saved encrypted company key and '+ids.length+' bot selection(s). No inference has run yet. Return to the app and send a message.';}catch(e){$('status').textContent=e.message;}};
</script></html>
