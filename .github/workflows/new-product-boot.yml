name: Single-company browser-first fresh-install boot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-product-boot:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CYPRESS_INSTALL_BINARY: '0'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NODE_OPTIONS: --max-old-space-size=6144
      ANONYMIZED_TELEMETRY: 'false'
      DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check native bootstrap extraction and cache regressions
        run: node --test installer/native-bootstrap.test.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned dependency resolver
        run: python -m pip install --disable-pip-version-check uv==0.11.19
      - name: Check smoke boundaries and dependency locks
        run: python -m unittest discover -s packaging -p test_new_product_boot_smoke.py -v
      - name: Install and start without CLI setup; test browser-first singleton, denial, race and restart
        run: python packaging/new_product_boot_smoke.py --install --installer --output work/new-product-boot-result.json
      - name: Upload only sanitized corrected-product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: new-product-boot-${{ matrix.os }}
          path: work/new-product-boot-result.json
          if-no-files-found: error
          retention-days: 7
