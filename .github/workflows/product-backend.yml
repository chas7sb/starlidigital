name: New product native core validation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CYPRESS_INSTALL_BINARY: '0'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked native bridge dependencies
        run: npm ci --prefix platform --no-audit --no-fund
      - name: Install locked agent runtime dependencies
        run: npm ci --prefix platform/extensions/starli-runtime --no-audit --no-fund
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned lock resolver
        run: python -m pip install --disable-pip-version-check uv==0.11.19
      - name: Verify target locks
        run: python packaging/check_backend_locks.py
      - name: Run actual new product core APIs in a hash-locked environment
        run: python packaging/product_backend_smoke.py --install --output work/product-backend-result.json
      - name: Upload only sanitized core validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-native-core-${{ matrix.os }}
          path: work/product-backend-result.json
          if-no-files-found: error
          retention-days: 7
